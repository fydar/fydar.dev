AWSTemplateFormatVersion: '2010-09-09'

Description: 'fydar.dev website: ECS on EC2 with Elastic IP'

Parameters:

  Tag:
    Type: String
    Description: Image tag to deploy.
    Default: latest

  DomainName:
    Type: String
    Description: Primary domain name for the server.
    Default: fydar.dev
    AllowedPattern: '^.*fydar\.dev$'

  KeyPairName:
    Type: String
    Description: EC2 KeyPair for SSH access.
    Default: manual-instance

  CertificateArn:
    Type: String
    Description: ARN of the exportable ACM certificate for HTTPS.
    Default: 'arn:aws:acm:us-east-1:222779217717:certificate/a9c7a3e6-a4df-48f4-b9ed-6c2e68c689e0'

  VpcCidr:
    Type: String
    Description: IPv4 CIDR block for the VPC.
    Default: '10.10.0.0/16'
    AllowedPattern: '^((1?[0-9]{1,2}|2[0-4][0-9]|25[0-5])\.){3}(1?[0-9]{1,2}|2[0-4][0-9]|25[0-5])\/(8|16|24)$'

  SubnetIPv4Cidr1:
    Type: String
    Description: IPv4 CIDR block for subnet 1.
    Default: '10.10.0.0/24'
    AllowedPattern: '^((1?[0-9]{1,2}|2[0-4][0-9]|25[0-5])\.){3}(1?[0-9]{1,2}|2[0-4][0-9]|25[0-5])\/(8|16|24|32)$'

  GitHubOAuthClientId:
    Type: String
    Description: Client ID of the GitHub OAuth application backing owner sign-in. Not a secret.
    Default: ''

  GitHubOAuthClientSecret:
    Type: String
    Description: >-
      The GitHub OAuth application's client secret, supplied at deploy time.
    Default: ''
    NoEcho: true

  SubnetAz1:
    Type: String
    Description: Availability zone for subnet 1.
    Default: us-east-1a
    AllowedValues:
      - us-east-1a
      - us-east-1b
      - us-east-1c
      - us-east-1d
      - us-east-1e
      - us-east-1f

Resources:

  # ── Networking ────────────────────────────────────────────────────────────────

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Ref DomainName

  PubSubnetAz1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref SubnetAz1
      CidrBlock: !Ref SubnetIPv4Cidr1
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${DomainName} subnet-az1'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${DomainName} igw'

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  RouteViaIgw:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${DomainName} rtb'

  PublicRouteViaIgw:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref RouteViaIgw
      GatewayId: !Ref InternetGateway
      DestinationCidrBlock: 0.0.0.0/0

  PubSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref RouteViaIgw
      SubnetId: !Ref PubSubnetAz1

  # ── IAM ───────────────────────────────────────────────────────────────────────

  Ec2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  Ec2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref Ec2InstanceRole

  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: website-task-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendRawEmail
                  - ses:SendEmail
                Resource: '*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource: '*'
              - Effect: Allow
                Action: acm:ExportCertificate
                Resource: !Ref CertificateArn

  # ── ECS ───────────────────────────────────────────────────────────────────────

  WebsiteCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: 'fydardev-cluster'

  WebsiteInstanceTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: website-instance
      NetworkMode: host
      RequiresCompatibilities:
        - EC2
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      ContainerDefinitions:
        - Name: website-instance
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/websiteinstance:${Tag}'
          Memory: 900
          PortMappings:
            - ContainerPort: 80
              Protocol: tcp
            - ContainerPort: 443
              Protocol: tcp
            - ContainerPort: 443
              Protocol: udp
          Environment:
            - Name: CONFIG_DOMAINNAME
              Value: !Ref DomainName
            - Name: CONFIG_CERTIFICATEARN
              Value: !Ref CertificateArn
            - Name: CONFIG_HTTPPORT
              Value: '80'
            - Name: CONFIG_HTTPSPORT
              Value: '443'
            - Name: CONFIG_Authentication__GitHub__ClientId
              Value: !Ref GitHubOAuthClientId
            - Name: CONFIG_Authentication__GitHub__ClientSecret
              Value: !Ref GitHubOAuthClientSecret
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: website-logs
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: website-instance

  WebsiteInstanceService:
    Type: AWS::ECS::Service
    DependsOn: Ec2Instance
    Properties:
      Cluster: !Ref WebsiteCluster
      ServiceName: WebsiteInstance
      TaskDefinition: !Ref WebsiteInstanceTask
      LaunchType: EC2
      DesiredCount: 1
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 50

  # ── EC2 ───────────────────────────────────────────────────────────────────────

  WebsiteInstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${DomainName}-sg'
      GroupDescription: SSH, HTTP, and HTTPS (TCP + UDP)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIpv6: '::/0'
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIpv6: '::/0'
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIpv6: '::/0'
        - IpProtocol: udp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: udp
          FromPort: 443
          ToPort: 443
          CidrIpv6: '::/0'

  WebsiteInstanceNetworkInterface:
    Type: AWS::EC2::NetworkInterface
    Properties:
      SubnetId: !Ref PubSubnetAz1
      Description: Website instance primary network interface
      GroupSet:
        - !Ref WebsiteInstanceSecurityGroup
      SourceDestCheck: true
      Tags:
        - Key: Name
          Value: !Sub '${DomainName} eni'

  WebPortAddress:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${DomainName} eip'

  AssociateWebPort:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt WebPortAddress.AllocationId
      NetworkInterfaceId: !Ref WebsiteInstanceNetworkInterface

  Ec2Instance:
    Type: AWS::EC2::Instance
    DependsOn: AttachGateway
    Properties:
      InstanceType: t4g.micro
      ImageId: ami-055458a83541771a4
      KeyName: !Ref KeyPairName
      IamInstanceProfile: !Ref Ec2InstanceProfile
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
            DeleteOnTermination: true
      PropagateTagsToVolumeOnCreation: true
      NetworkInterfaces:
        - DeviceIndex: 0
          NetworkInterfaceId: !Ref WebsiteInstanceNetworkInterface
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash -xe
          echo ECS_CLUSTER=${WebsiteCluster} >> /etc/ecs/ecs.config

          # Allow non-root processes to bind to ports 80+ (inherited by
          # containers in host network mode, persisted across reboots).
          sysctl -w net.ipv4.ip_unprivileged_port_start=80
          echo 'net.ipv4.ip_unprivileged_port_start=80' >> /etc/sysctl.conf
      Tags:
        - Key: Name
          Value: !Sub '${DomainName} instance'

  # ── DNS ───────────────────────────────────────────────────────────────────────

  WebsiteInstanceRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneName: fydar.dev.
      Name: !Ref DomainName
      Type: A
      TTL: 30
      ResourceRecords:
        - !Ref WebPortAddress

  WebsiteWwwRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneName: fydar.dev.
      Name: www.fydar.dev
      Type: A
      TTL: 30
      ResourceRecords:
        - !Ref WebPortAddress

Outputs:

  PublicIp:
    Description: Elastic IP address of the website.
    Value: !Ref WebPortAddress

  ClusterName:
    Description: ECS cluster name.
    Value: !Ref WebsiteCluster

  ServiceName:
    Description: ECS service name.
    Value: !GetAtt WebsiteInstanceService.Name
